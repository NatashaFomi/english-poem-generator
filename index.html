<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>AI english poem generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to an English poem generator</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="poem-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of the English poem"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: Flowers, Love, Nature</div>
        </div>

        <div class="poem-output hidden" id="poem-output">
          <br />
        </div>
      </main>

      <footer>
        This project is coded by
        <a href="https://github.com/NatashaFomi" target="_blank">
          Nataliia Fomina
        </a>
        and is
        <a
          href="https://github.com/NatashaFomi/english-poem-generator"
          target="_blank"
        >
          open-sourced on GitHub
        </a>
        and
        <a href="https://english-poem-generator8.netlify.app/" target="_blank">
          hosted on Netlify
        </a>
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
